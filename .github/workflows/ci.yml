name: CI Checks

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run Typecheck
        run: pnpm exec tsc --noEmit

      - name: Run Linter
        run: pnpm lint

      - name: Notificar a Slack
        if: always() # Se ejecuta pase o falle el pipeline
        uses: 8398a7/action-slack@v3
        with:
                  status: custom
                  custom_payload: |
                    {
                      attachments: [{
                        color: '${{ job.status }}' === 'success' ? '#36a64f' : '#FF0000',
                        text: `${'${{ job.status }}' === 'success' ? '🟢 *CI PASSED*' : '🔴 *CI FAILED*'}\n*Repositorio:* ${{ github.repository }}\n*Commit:* ${{ github.event.head_commit.message }}\n*Autor:* ${{ github.actor }}`
                      }]
                    }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}